[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nnzero"]

[project]
name = "nn-zero-to-hero"
version = "2026.6.0"
description = "Modernized teaching materials for Neural Networks: Zero to Hero, with reproducible environments and reusable building blocks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Andrej Karpathy", email = "andrej.karpathy@gmail.com" },
]
keywords = ["neural-networks", "pytorch", "education", "deep-learning", "micrograd", "makemore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "graphviz>=0.21",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.0",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.13.0"]

[project.urls]
Homepage = "https://github.com/karpathy/nn-zero-to-hero"
Repository = "https://github.com/karpathy/nn-zero-to-hero"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "nbval>=0.11.0",
    "papermill>=2.7.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
