[project]
name = "prompt-engineering-notebooks"
version = "0.1.0"
description = "Prompt Engineering teaching notebooks — all 8 core topics"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.8.0",
    "anthropic>=1.3.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "rich>=14.0.0",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
